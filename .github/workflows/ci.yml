name: CI

# Runs on every pull request. Without this, a branch could be merged red and the
# first thing to notice would be the deploy job on `main` -- after the merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the answer, and the
      # workspace has already been bitten by a different dependency tree.
      - run: npm ci

      - run: npm test

      # `npm run build` is `tsc --noEmit && vite build`, so this covers typecheck.
      - run: npm run build

      - name: Report bundle size against NFR-PERF-04
        run: |
          # The threshold lives in docs/02-requirements/nfr.md. Printed rather than
          # enforced for now: the budget is 200KB and the build is well under it, so
          # a hard gate would only ever fire on a mistake this log already shows.
          echo "gzip sizes of the built assets:"
          for f in dist/assets/*.js dist/assets/*.css; do
            [ -f "$f" ] || continue
            printf '  %-40s %s\n' "$(basename "$f")" "$(gzip -c "$f" | wc -c | awk '{printf "%.1f kB", $1/1024}')"
          done

  # A SEPARATE job, so the audit runs beside the tests instead of in front of them.
  # Measured on the first run of this workflow: npm ci took 157s and npm audit 212s
  # while test and build together took 2s, so the audit was 56% of a 377s critical
  # path for no reason. `npm audit` reads package-lock.json and asks the registry --
  # it needs no node_modules, so this job skips the install entirely.
  #
  # NFR-SEC-02 names CI as where this threshold is checked; this is that check.
  # `--audit-level=high` fails on high and critical only: moderate advisories in
  # dev-only tooling would otherwise block every pull request.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Retried, and an unreachable registry is NOT a failure. The audit endpoint
      # returned 503 on this workflow's own run, which turned a security check into
      # a random merge blocker for a reason that has nothing to do with the code.
      # A real advisory still fails the job; an outage reports and passes.
      - name: npm audit (high and above)
        run: |
          for attempt in 1 2 3; do
            out=$(npm audit --audit-level=high 2>&1) && { echo "$out"; exit 0; }
            code=$?
            if echo "$out" | grep -qiE 'audit endpoint returned an error|Service Unavailable|ENOTFOUND|ETIMEDOUT|ECONNRESET'; then
              echo "::warning::audit attempt $attempt could not reach the registry"
              sleep $((attempt * 15))
              continue
            fi
            echo "$out"
            exit $code
          done
          echo "::warning::npm audit could not reach the registry after 3 attempts; not failing the build for someone else's outage"

