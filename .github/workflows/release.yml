name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the version is computed from the range since the
          # previous tag, so a shallow clone would compute the wrong answer rather
          # than fail loudly.
          fetch-depth: 0

      - name: Decide the version
        id: version
        run: bash .github/scripts/next-version.sh

      - name: Say why nothing is being released
        if: steps.version.outputs.skip == 'true'
        run: |
          echo "No release: ${{ steps.version.outputs.reason }}"

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      # A tag is permanent and people read it as "this worked". Verifying here
      # costs a minute of CI and is what keeps a version number from pointing at a
      # red commit -- worth more than the minute.
      - name: Verify before tagging
        if: steps.version.outputs.skip == 'false'
        run: |
          npm ci
          npm test
          npm run build

      - name: Compose the notes
        id: notes
        if: steps.version.outputs.skip == 'false'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash .github/scripts/release-notes.sh \
            "${{ steps.version.outputs.next }}" \
            "${{ steps.version.outputs.previous }}" > /tmp/notes.md
          echo "--- notes ---"
          cat /tmp/notes.md

      - name: Create the release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.next }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.next }}" \
            --notes-file /tmp/notes.md
